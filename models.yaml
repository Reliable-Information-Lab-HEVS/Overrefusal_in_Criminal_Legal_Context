# =============================================================================
# models.yaml  --  the ONLY file you edit to add or change a model.
# =============================================================================
# To add a model to the benchmark, append one entry under `models:` below.
# No Python edits are needed. After editing, run `python run.py` as usual.
#
# Each model entry has:
#   name            (required) display name; also written to the CSV "model"
#                   column and, for APIs, sent as the model id in the request.
#   backend         (required) one of:
#                     - ollama             local Ollama server (no API key)
#                     - openai_compatible  any HTTP endpoint that speaks the
#                                          OpenAI /chat/completions format
#                                          (vLLM, your own internal endpoint, ...)
#
#   For backend: openai_compatible, also provide:
#     base_url      (required) full chat-completions URL.
#     api_key_env   (required) name of the environment variable that holds the
#                   API key (the key itself stays in your .env / environment,
#                   never in this file). Use "" if the endpoint needs no key.
#     headers       (optional) extra HTTP headers (e.g. a required User-Agent).
#     timeout       (optional) request timeout in seconds (default: 90).
#     retry         (optional) retry transient 5xx/429/timeout with backoff:
#                     max_retries / initial_backoff_seconds / backoff_multiplier
#
# Selection at run time (these flags filter this list, they do not bypass it):
#   --ollama-only        keep only backend: ollama entries
#   --api-only           keep only non-ollama entries
#   --ollama-models A B  replace the ollama entries with the names you pass
# =============================================================================

models:
  # ---- Local models served by Ollama (free, run on your own GPU) -----------
  - name: "llama3.1:8b"
    backend: ollama
  - name: "gemma3:4b"
    backend: ollama

  # ---- EXAMPLES: more local Ollama models ----------------------------------
  # Uncomment after pulling them (`ollama pull <name>`).
  # - name: "qwen2.5:7b"
  #   backend: ollama
  # - name: "hf.co/bartowski/swiss-ai_Apertus-8B-Instruct-2509-GGUF:Q4_K_M"
  #   backend: ollama

  # ---- TEMPLATE: your own internal OpenAI-compatible endpoint --------------
  # Uncomment and adapt. This is all the Federal Tribunal needs to plug in an
  # in-house model: a URL and the name of the env var holding its key.
  # - name: "tf-internal-llm"
  #   backend: openai_compatible
